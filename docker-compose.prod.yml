# ============================================================
# Sazanami Blog - Docker Compose (本番環境)
# ============================================================
# 起動コマンド: docker compose -f docker-compose.prod.yml up -d --build
# 停止コマンド: docker compose -f docker-compose.prod.yml down
# ============================================================
# セキュリティ:
#   - 内部ネットワーク分離（コンテナ間通信を限定）
#   - 各コンテナは非rootユーザーで実行
#   - 環境変数はenv_fileで外部管理（リポジトリにコミットしない）
#   - read_only, no-new-privileges でコンテナの攻撃面を最小化
# 軽量化:
#   - Alpine + マルチステージビルドで各イメージを極小化
#   - ヘルスチェックを設定し、異常時は自動再起動
# ============================================================

services:
  # ----------------------------------------------------------
  # Strapi CMS (バックエンド / 本番モード)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sazanami-backend
    restart: unless-stopped
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    volumes:
      # 名前付きボリュームによるデータの永続化
      - strapi-data:/opt/app/.tmp
      - strapi-uploads:/opt/app/public/uploads
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    # セキュリティ: 新しい特権の取得を禁止
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  # ----------------------------------------------------------
  # Astro SSR (フロントエンド / 本番モード)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sazanami-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # コンテナ間でのAPI通信用URL
      - STRAPI_API_URL=http://backend:1337
      # ブラウザが画像等にアクセスするための公開URL
      - STRAPI_PUBLIC_URL=${STRAPI_PUBLIC_URL:-http://localhost:1337}
      - STRAPI_TOKEN=${STRAPI_TOKEN}
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
    # セキュリティ: 書き込み不要なためファイルシステムを読み取り専用にする
    read_only: true
    # Node.js が一時ファイルを書き込むための最小限のtmpfs
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

# ----------------------------------------------------------
# 名前付きボリューム（データの永続化）
# ----------------------------------------------------------
volumes:
  strapi-data:
    driver: local
  strapi-uploads:
    driver: local

# ----------------------------------------------------------
# 内部ネットワーク（コンテナ間通信を分離）
# ----------------------------------------------------------
networks:
  internal:
    driver: bridge
