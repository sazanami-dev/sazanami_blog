services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sazanami-backend
    restart: unless-stopped
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    volumes:
      - strapi-data:/opt/app/.tmp
      - strapi-uploads:/opt/app/public/uploads
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1337/_health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sazanami-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - STRAPI_API_URL=http://backend:1337
      - STRAPI_PUBLIC_URL=${STRAPI_PUBLIC_URL:-http://localhost:1337}
      - STRAPI_TOKEN=${STRAPI_TOKEN}
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

volumes:
  strapi-data:
    driver: local
  strapi-uploads:
    driver: local

networks:
  internal:
    driver: bridge
